name: Build status
on:
  push:
    paths-ignore:
    - 'wiki/**'
  pull_request:
    paths-ignore:
    - 'wiki/**'

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

    - name: Check out code into the Go module directory
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
        cache: false

    - name: Get dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libnetfilter-queue-dev libmnl-dev libpcap-dev

    # This branch has no go.sum, so the build is allowed to write one.
    - name: Build
      run: |
        cd daemon
        go build -mod=mod -v .
