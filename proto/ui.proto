syntax = "proto3";

package protocol;

option go_package = "github.com/evilsocket/opensnitch/daemon/ui/protocol";

service UI {
    rpc Ping(PingRequest) returns (PingReply) {}
    rpc AskRule (Connection) returns (Rule) {}
    rpc Subscribe (ClientConfig) returns (ClientConfig) {}
    rpc Notifications (stream NotificationReply) returns (stream Notification) {}
    rpc PostAlert(Alert) returns (MsgResponse) {}
}

/**
  - Send error messages (kernel not compatible, etc)
  - Send warnings (eBPF modules failed loading, etc)
  - Send kernel events: new execs, bytes recv/sent, ...
  - Alert of events defined by the user: alert when a rule matches
*/
message Alert {
    enum Priority {
        LOW = 0;
        MEDIUM = 1;
        HIGH = 2;
    }
    enum Type {
        ERROR = 0;
        WARNING = 1;
        INFO = 2;
    }
    enum Action {
        NONE = 0;
        SHOW_ALERT = 1;
        SAVE_TO_DB = 2;
    }
    // What caused the alert
    enum What {
        GENERIC = 0;
        PROC_MONITOR = 1;
        FIREWALL = 2;
        CONNECTION = 3;
        RULE = 4;
        NETLINK = 5;
        // bind, exec, etc
        KERNEL_EVENT = 6;
        // an inbound port scan was detected against this host
        PORT_SCAN = 7;
    }

    uint64 id = 1;
    Type type = 2;
    // TODO: group of actions: SHOW_ALERT | SAVE_TO_DB
    Action action = 3;
    Priority priority = 4;
    What what = 5;
    // https://developers.google.com/protocol-buffers/docs/reference/go-generated#oneof
    oneof data {
        // errors, messages, etc
        string text = 6;
        // proc events: send/recv bytes, etc
        Process proc = 8;
        // conn events: bind, listen, etc
        Connection conn = 9;
        Rule rule = 10;
        FwRule fwrule = 11;
    }
    // Inbound port scan events. Deliberately OUTSIDE the oneof: a port scan
    // alert also carries a one-line summary in `text`, which is all a GUI that
    // predates this field can show. Inside the oneof, such a GUI would receive
    // an alert with an empty body, marked critical when it proposed a block.
    PortScan portscan = 12;
}

/* PortScan describes an inbound port scan detected against this host.
 *
 * Every field states only what the observed packets establish. In particular
 * src_ip is "the address the packets carried", NOT "the attacker": with
 * nmap -D (decoys), nmap -S (spoofing), an idle scan or an FTP bounce, the
 * source address belongs to an uninvolved third party and the real origin is
 * not recoverable from the traffic. Anything acting on this message -- above
 * all, blocking -- must treat it that way.
 */
message PortScan {
    // The source address the packets carried.
    string src_ip = 1;

    // Link-layer source address, formatted aa:bb:cc:dd:ee:ff, empty if the
    // packet source could not see layer 2 (a point-to-point tunnel, for
    // instance).
    string src_mac = 2;
    // Whether src_mac is the scanner's own address. It is only so when the
    // source is on a directly attached subnet; otherwise the MAC belongs to
    // the last router the packets crossed and identifies nobody. A client
    // displaying src_mac without honouring this flag would be attributing a
    // router's address to an attacker.
    bool src_mac_is_source_own = 3;

    // Stable identifier of the technique, e.g. "tcp-syn", "tcp-xmas",
    // "tcp-ack", "udp", "ip-protocol", "tcp-fragmented". Values are never
    // repurposed; new ones may be added.
    string method = 4;
    // Human-readable description, naming every nmap option that produces
    // indistinguishable packets rather than picking one arbitrarily.
    string method_detail = 5;
    // TCP control bits summarised the way scanlogd does: one character per
    // bit, uppercase when always set, lowercase when always clear, '?' when it
    // varied between packets. Empty when no TCP flags were readable.
    string flags_summary = 6;

    uint32 distinct_ports = 7;
    uint32 min_port = 8;
    uint32 max_port = 9;
    // A sample of the probed ports, capped. Not the full list.
    repeated uint32 sample_ports = 10;
    // Number of distinct IP protocol numbers seen from this source.
    uint32 protocols = 11;
    // Set when the source varied the IP protocol rather than the port, which
    // is what nmap -sO does.
    bool is_protocol_scan = 12;

    uint32 score = 13;
    string interface = 14;
    // Local addresses this source probed.
    repeated string targets = 15;

    int64 first_seen_unixnano = 16;
    int64 last_seen_unixnano = 17;

    // Packet-level oddities observed: fragmentation, an over-long IPv6
    // extension header chain (the Topera evasion signature), truncated
    // headers, a SYN carrying no TCP options (a raw packet generator such as
    // masscan). Reported rather than dropped: an evasion attempt is evidence.
    repeated string anomalies = 18;

    // Whether a probe only a scanner sends contributed: a SYN, TCP flags that
    // cannot acknowledge anything, or a TCP probe whose flags could not be read
    // (nmap -f). Not merely whether TCP arrived: TCP carrying ACK has the
    // shape of return traffic and does not count. An accusation without it
    // rests on an address that costs nothing to forge, so it must not on its
    // own justify blocking.
    bool has_tcp_evidence = 19;
    // Whether policy allows a block to be proposed or applied for this source.
    bool block_eligible = 20;
    // How many further scan events were withheld by rate limiting since the
    // last one was sent. Non-zero means several sources are scanning and the
    // client must say so, instead of presenting this as the only one.
    uint64 suppressed_since = 21;
    // Seconds a block would last if accepted.
    uint32 block_duration_seconds = 22;
}

message MsgResponse {
    uint64 id = 1;
}

message Event {
    string time = 1;
    Connection connection = 2;
    Rule rule = 3;
    int64 unixnano = 4;
}

message Statistics {
    string daemon_version = 1;
    uint64 rules = 2;
    uint64 uptime = 3;
	uint64 dns_responses = 4;
	uint64 connections  = 5;
	uint64 ignored = 6;
	uint64 accepted = 7;
	uint64 dropped = 8;
	uint64 rule_hits = 9;
	uint64 rule_misses = 10;
	map<string, uint64> by_proto = 11;
	map<string, uint64> by_address = 12;
	map<string, uint64> by_host = 13;
	map<string, uint64> by_port = 14;
	map<string, uint64> by_uid = 15;
	map<string, uint64> by_executable = 16;
    repeated Event events = 17;
}

message PingRequest {
    uint64 id = 1;
    Statistics stats = 2;
}

message PingReply {
    uint64 id = 1;
}

message StringInt {
    string key = 1;
    uint32 value = 2;
}

message Process {
    uint64 pid = 1;
    uint64 ppid = 2;
    uint64 uid = 3;
    string comm = 4;
    string path = 5;
    repeated string args = 6;
    map<string, string> env = 7;
    string cwd = 8;
    map<string, string> checksums = 9;
    uint64 io_reads = 10;
    uint64 io_writes = 11;
    uint64 net_reads = 12;
    uint64 net_writes = 13;
    repeated StringInt process_tree = 14;
}

message Connection {
    string protocol = 1;
    string src_ip = 2;
    uint32 src_port = 3;
    string dst_ip = 4;
    string dst_host = 5;
    uint32 dst_port = 6;
    uint32 user_id = 7;
    uint32 process_id = 8;
    string process_path = 9;
    string process_cwd = 10;
    repeated string process_args = 11;
    map<string, string> process_env = 12;
    map<string, string> process_checksums = 13;
    repeated StringInt process_tree = 14;
}

message Operator {
    string type = 1;
    string operand = 2;
    string data = 3;
    bool sensitive = 4;
    repeated Operator list = 5;
}

message Rule {
    int64 created = 1;
    string name = 2;
    string description = 3;
    bool enabled = 4;
    bool precedence = 5;
    bool nolog = 6;
    string action = 7;
    string duration = 8;
    Operator operator = 9;
}

/* Action is the list of actions sent or received via the Notifications channel.
 */
enum Action {
    NONE = 0;
    ENABLE_INTERCEPTION = 1;
    DISABLE_INTERCEPTION = 2;
    ENABLE_FIREWALL = 3;
    DISABLE_FIREWALL = 4;
    RELOAD_FW_RULES = 5;
    CHANGE_CONFIG = 6;
    ENABLE_RULE = 7;
    DISABLE_RULE = 8;
    DELETE_RULE = 9;
    CHANGE_RULE = 10;
    LOG_LEVEL = 11;
    STOP = 12;

    /* Notifications of type TASK_START or TASK_STOP expect a JSON in the
     * Notification.data field.
     * It's parsed to a struct with format
     * TaskNotification { Name string, Data interface{} }
     * where Data is translated to a map of values (map[string]string), with
     * the configuration for each task:
     * PidMonitor: {"interval": "5s", "pid": "1234"}
     * SocketsMonitor: {"interval": "5s", "states": "1,10"}
     */
    TASK_START = 13;
    TASK_STOP = 14;

    /* Sent by the GUI when the user answers a port scan alert, or blocks a
     * source of the detection history after the fact.
     *
     * Notification.data carries a JSON object:
     *   {"ip": "192.0.2.66", "dismiss": false, "force": false}
     *
     * "dismiss": true answers "Ignore": the pending proposal is forgotten and
     * nothing is blocked. "force": true blocks a source whose detection is not
     * enough on its own (its address may be forged); the user was warned. The
     * daemon blocks only a source it reported, and never one on its
     * never-block list. The block lasts the node's configured
     * PortScan.Block.Duration; the GUI does not choose it. The daemon replies
     * OK, or ERROR with the reason it refused.
     *
     * The daemon, not the GUI, owns the block: it installs the firewall rule
     * and expires it. A GUI that installed the rule itself would leave a
     * permanent block behind the moment it was closed, and there would be no
     * enforcement at all on a headless node.
     */
    PORTSCAN_BLOCK = 15;
    /* Release a block early. Notification.data: {"ip": "192.0.2.66"}.
     * With "forget": true, remove the source from the list instead: its
     * block, if any, is released and its detection deleted; ERROR if the
     * daemon lists neither. A daemon that predates "forget" ignores it.
     */
    PORTSCAN_UNBLOCK = 16;
    /* Ask why an address is blocked and how. Notification.data:
     * {"ip": "192.0.2.66"}. The daemon replies OK with a JSON object in
     * NotificationReply.data: the block, the scan that led to it, and the
     * firewall objects applying it, read back from the firewall (see
     * daemon/tasks/portscanblocks.Info). For a source of the detection
     * history that is not blocked, the scan and what became of it. ERROR if
     * the address is neither.
     */
    PORTSCAN_BLOCK_INFO = 17;
}

message StatementValues {
    string Key = 1;
    string Value = 2;
}

message Statement {
    string Op = 1;
    string Name = 2;
    repeated StatementValues Values = 3;
}

message Expressions {
    Statement Statement = 1;
}

message FwRule {
    // DEPRECATED: for backward compatibility with iptables
    string Table = 1;
    string Chain = 2;

    string UUID = 3;
    bool Enabled = 4;
    uint64 Position = 5;
    string Description = 6;
    string Parameters = 7;
    repeated Expressions Expressions = 8;
    string Target = 9;
    string TargetParameters = 10;
}

message FwChain {
    string Name = 1;
    string Table = 2;
    string Family = 3;
    string Priority = 4;
    string Type = 5;
    string Hook = 6;
    string Policy = 7;
    repeated FwRule Rules = 8;
}

message FwChains {
    // DEPRECATED: backward compatibility with iptables
    FwRule Rule = 1;
    repeated FwChain Chains = 2;
}

message SysFirewall {
    bool Enabled = 1;
    uint32 Version = 2;
    repeated FwChains SystemRules = 3;
}

// client configuration sent on Subscribe()
message ClientConfig {
    uint64 id = 1;
    string name = 2;
    string version = 3;
    bool isFirewallRunning = 4;
    // daemon configuration as json string
    string config = 5;
    uint32 logLevel = 6;
    repeated Rule rules = 7;
    SysFirewall systemFirewall = 8;
}

/* Notification message is sent to the clients (daemons) from the GUI (server)
 * for several purposes:
 *  - Start tasks.
 *  - Change configurations (rules, firewall, configuration)
 *  - Start / Stop interception or firewall.
 *  - Sent back the status of each task (errors, ok)
 *
 * Notifications are sent via an always open streaming channel.
 * It's also used indirectly to maintain the connection status with the GUI (server).
 */
message Notification {
    uint64 id = 1;
    string clientName = 2;
    string serverName = 3;
    // CHANGE_CONFIG: 2, data: {"default_timeout": 1, ...}
    Action type = 4;
    string data = 5;   
    repeated Rule rules = 6;
    SysFirewall sysFirewall = 7;
}

// notification reply sent to the server (GUI)
message NotificationReply {
    uint64 id = 1;
    NotificationReplyCode code = 2;
    string data = 3;
}

enum NotificationReplyCode {
    OK = 0;
    ERROR = 1;
}
